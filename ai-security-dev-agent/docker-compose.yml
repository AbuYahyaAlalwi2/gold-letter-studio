name: ai-security-dev-agent

services:
  dsh:
    build:
      context: ./dsh
      dockerfile: Dockerfile
    environment:
      DSH_HOME: /data/dsh
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-http://localhost:3080/}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-localhost}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - dsh-data:/data
      - ./workspace:/workspace:rw
    depends_on:
      litellm:
        condition: service_started
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [agent]

  litellm:
    image: ghcr.io/berriai/litellm:v1.63.14-stable
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      UPSTREAM_API_BASE: ${UPSTREAM_API_BASE:?Set UPSTREAM_API_BASE in .env}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?Set UPSTREAM_API_KEY in .env}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:?Set UPSTREAM_MODEL in .env}
    volumes:
      - ./llm-proxy/config.yaml:/app/config.yaml:ro
    expose: ["4000"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [agent]

networks:
  agent:
    driver: bridge

volumes:
  dsh-data:
