services:
  dsh:
    build: ./dsh
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN in .env}
      PORT: 8080
      PROJECT_ROOT: /workspace
      DATABASE_PATH: /data/agent.sqlite3
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-local-model}
      SEMGREP_TIMEOUT_SECONDS: ${SEMGREP_TIMEOUT_SECONDS:-120}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workspace:/workspace:rw
      - agent-data:/data
    depends_on:
      litellm:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.63.14-stable
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./llm-proxy/config.yaml:/app/config.yaml:ro
    expose: ["4000"]
    depends_on: [ollama]
    read_only: true
    tmpfs: [/tmp:size=128m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]
    restart: unless-stopped

  playwright-mcp:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    working_dir: /app
    entrypoint: ["npx", "--yes", "@playwright/mcp@latest", "--host", "0.0.0.0", "--port", "8931"]
    expose: ["8931"]
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 1gb
    networks: [backend]
    profiles: [browser]

  semgrep:
    image: returntocorp/semgrep:1.101.0
    entrypoint: ["sleep", "infinity"]
    profiles: [scanner-cli]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]

volumes:
  agent-data:
  ollama-data:

networks:
  backend:
    internal: true
