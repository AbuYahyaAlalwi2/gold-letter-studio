version: "3.9"

services:
  dsh:
    build:
      context: ./dsh
    env_file:
      - .env
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN}
      PORT: ${PORT:-8080}
      LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
      PLAYWRIGHT_MCP_URL: ${PLAYWRIGHT_MCP_URL:-http://playwright-mcp:8931}
      MEM0_URL: ${MEM0_URL:-http://mem0:8000}
      PROJECT_ROOT: ${PROJECT_ROOT:-/workspace}
    ports:
      - "8080:8080"
    depends_on:
      - litellm
      - playwright-mcp
      - mem0
      - semgrep
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./workspace:/workspace:rw
    networks:
      - ai-agent-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    env_file:
      - .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./llm-proxy/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-agent-net

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-agent-net

  playwright-mcp:
    build:
      context: ./browser
    ports:
      - "8931:8931"
    command: ["npx", "@playwright/mcp", "--host", "0.0.0.0", "--port", "8931"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-agent-net

  semgrep:
    image: returntocorp/semgrep:latest
    entrypoint: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-agent-net

  mem0:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      - .env
    command: >-
      sh -lc "pip install --no-cache-dir mem0ai fastapi uvicorn &&
      python -m mem0.server --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai-agent-net

  sandbox:
    build:
      context: ./sandbox
    environment:
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-180}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - ai-agent-net

volumes:
  ollama-data:

networks:
  ai-agent-net:
    driver: bridge
