# Configure the official DSH web profile to use the LiteLLM OpenAI-compatible
# gateway. Values are read at launch; the API secret stays in the environment.
- id: llm-pi-ai
  config:
    providers:
      custom-gateway:
        displayName: Configured API Gateway
        apiKeyEnv: LITELLM_MASTER_KEY
        api: openai-completions
        baseURL: http://litellm:4000/v1
        models:
          - id: gateway-model
            name: Configured gateway model
            contextWindow: 128000
            reasoningEfforts:
              off:
              low:
              medium:
              high:

- id: agent-default-model
  config:
    provider: custom-gateway
    model: gateway-model
