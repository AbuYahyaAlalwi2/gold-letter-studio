model_list:
  - model_name: gateway-model
    litellm_params:
      model: os.environ/UPSTREAM_MODEL
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY
  - model_name: gateway-fallback
    litellm_params:
      model: os.environ/FALLBACK_MODEL
      api_base: os.environ/FALLBACK_API_BASE
      api_key: os.environ/FALLBACK_API_KEY

router_settings:
  fallbacks:
    - gateway-model: [gateway-fallback]

litellm_settings:
  drop_params: true
  request_timeout: 180
  num_retries: 1
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
