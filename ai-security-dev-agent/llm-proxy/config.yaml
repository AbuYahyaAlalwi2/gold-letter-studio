# OpenAI-compatible upstream model. Use the provider's OpenAI-compatible API
# base URL and its LiteLLM provider-prefixed model identifier (e.g. openai/model).
model_list:
  - model_name: gateway-model
    litellm_params:
      model: os.environ/UPSTREAM_MODEL
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 180
  num_retries: 2
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
